name: Risk foundation tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  risk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m coverage run -m pytest -q
      - run: python -m coverage report
      - run: python -m coverage json
      - run: python scripts/check_coverage.py
      - run: python -m alphagrid
      # No credentials, scheduled trading, deployment, or broker mutations in CI.
